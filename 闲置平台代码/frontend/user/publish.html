<!DOCTYPE html>
<!--
  页面名称：发布物资页
  所属角色：部门用户（以“专业学院 + 下设部门”身份发布）
  依赖 API：GET /api/colleges、POST /api/assets（multipart：字段 + files）
  图片规则：仅允许拍照 / 相册上传的真实照片，后端校验文件头与内容指纹，禁止 AI 生成或伪造
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>发布物资 · 公共资产闲置平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/js/common.css" />
</head>
<body>
    <div class="page">
        <h1 class="page-title">发布闲置物资</h1>
        <div class="page-sub" id="dept-info">加载中...</div>

        <div id="err" class="alert alert-error hidden"></div>

        <form id="publish-form" autocomplete="off">
            <!-- ---------------- 发布主体：学院 → 部门 两级联动 ---------------- -->
            <div class="card mb-4">
                <div class="card-body">
                    <h2 class="card-title">发布主体</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="field" style="margin-bottom:0">
                            <label class="label" for="college_id">专业学院</label>
                            <select class="select" id="college_id" required></select>
                        </div>
                        <div class="field" style="margin-bottom:0">
                            <label class="label" for="department_id">下设部门</label>
                            <select class="select" id="department_id" required></select>
                        </div>
                    </div>
                    <div class="muted" style="font-size:12px;margin-top:8px">
                        默认使用当前登录部门，也可改为其他部门发布（代发布会在流转与日志中记录实际发布部门）。
                    </div>
                </div>
            </div>

            <!-- ---------------- 资产信息 ---------------- -->
            <div class="card mb-4">
                <div class="card-body">
                    <h2 class="card-title">资产信息</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="field">
                            <label class="label" for="asset_no">资产编号 <span style="color:#dc2626">*</span></label>
                            <input class="input mono" id="asset_no" placeholder="如 ZC-2026-101（平台唯一）" required />
                        </div>
                        <div class="field">
                            <label class="label" for="name">资产名称 <span style="color:#dc2626">*</span></label>
                            <input class="input" id="name" placeholder="如 办公桌椅" required />
                        </div>
                        <div class="field">
                            <label class="label" for="category">分类</label>
                            <input class="input" id="category" list="category-options" placeholder="如 办公家具" />
                            <datalist id="category-options"></datalist>
                        </div>
                        <div class="field">
                            <label class="label" for="unit">计量单位</label>
                            <input class="input" id="unit" value="件" />
                        </div>
                        <div class="field">
                            <label class="label" for="spec">尺寸规格</label>
                            <input class="input" id="spec" placeholder="如 1200×600×750mm" />
                        </div>
                        <div class="field">
                            <label class="label" for="total_count">总数 <span style="color:#dc2626">*</span></label>
                            <input class="input" id="total_count" type="number" min="1" step="1" required />
                        </div>
                        <div class="field" style="grid-column:1/-1">
                            <label class="label" for="condition_desc">成色 / 状态说明</label>
                            <input class="input" id="condition_desc" placeholder="如 八成新，桌面有轻微划痕" />
                        </div>
                        <div class="field" style="grid-column:1/-1">
                            <label class="label" for="remark">备注</label>
                            <textarea class="textarea" id="remark" rows="2" placeholder="补充说明，如是否可拆分、是否需自提"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ---------------- 使用管理 ---------------- -->
            <div class="card mb-4">
                <div class="card-body">
                    <h2 class="card-title">使用管理</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="field">
                            <label class="label" for="using_person">使用人</label>
                            <input class="input" id="using_person" />
                        </div>
                        <div class="field">
                            <label class="label" for="usage_direction">使用方向</label>
                            <input class="input" id="usage_direction" placeholder="如 教学实训" />
                        </div>
                        <div class="field">
                            <label class="label" for="manage_dept">使用的管理部门</label>
                            <input class="input" id="manage_dept" list="manage-options" />
                            <datalist id="manage-options"></datalist>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ---------------- 存放联系 ---------------- -->
            <div class="card mb-4">
                <div class="card-body">
                    <h2 class="card-title">存放联系</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="field">
                            <label class="label" for="location">存放地点 <span style="color:#dc2626">*</span></label>
                            <input class="input" id="location" list="location-options" required />
                            <datalist id="location-options"></datalist>
                        </div>
                        <div class="field">
                            <label class="label" for="contact_person">联系人 <span style="color:#dc2626">*</span></label>
                            <input class="input" id="contact_person" required />
                        </div>
                        <div class="field">
                            <label class="label" for="contact_emp_no">工号 <span style="color:#dc2626">*</span></label>
                            <input class="input mono" id="contact_emp_no" required />
                        </div>
                        <div class="field">
                            <label class="label" for="contact_phone">联系电话 <span style="color:#dc2626">*</span></label>
                            <input class="input mono" id="contact_phone" placeholder="手机号或 010-12345678" required />
                        </div>
                    </div>
                </div>
            </div>

            <!-- ---------------- 真实图片上传 ---------------- -->
            <div class="card mb-4">
                <div class="card-body">
                    <h2 class="card-title">真实照片 <span style="color:#dc2626">*</span></h2>
                    <div class="alert alert-info">
                        仅限现场拍照或从手机/设备相册选择真实物资照片；禁止 AI 生成图、合成拼接图、网图盗图及与实物不符的说明图。
                        上传后系统自动叠加「部门 + 资产编号 + 时间」水印并留痕，管理员可抽检驳回。
                    </div>
                    <div class="flex gap-2 no-print">
                        <!-- capture="environment"：手机端直接调起后置摄像头拍照 -->
                        <input id="file-input" class="hidden" type="file" accept="image/*" capture="environment" multiple />
                        <button type="button" class="btn btn-outline btn-sm" id="btn-pick">拍照 / 选择相册图片</button>
                        <span class="muted" style="font-size:12px;align-self:center" id="file-tip">未选择图片</span>
                    </div>
                    <div id="preview" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3"></div>
                </div>
            </div>

            <div class="no-print flex gap-2">
                <button class="btn" type="submit" id="btn-submit">提交并上架到公共平台</button>
                <a class="btn btn-outline" href="/user/browse.html">取消</a>
            </div>
        </form>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script>
        PAIP.boot({
            role: "user",
            active: "publish",
            init: function (user) {
                document.getElementById("dept-info").textContent =
                    "当前部门：" + (user.dept_full_name || "-") + " · " + user.name + " · 工号 " + (user.employee_no || "-");

                var collegeSel = document.getElementById("college_id");
                var deptSel = document.getElementById("department_id");
                var colleges = [];
                var pickedFiles = [];      // 待上传的真实文件
                var coverIndex = 0;        // 首图下标

                // ---------- 加载学院并联动部门 ----------
                API.colleges()
                    .then(function (data) {
                        // 发布主体可调整到任意启用中的学院/部门（默认本部门），跨部门代发布会在日志中留痕
                        colleges = data.filter(function (c) { return c.status === "active"; });
                        collegeSel.innerHTML = colleges
                            .map(function (c) {
                                return '<option value="' + c.id + '">' + PAIP.escapeHtml(c.name) + "</option>";
                            })
                            .join("");
                        if (user.college_id) collegeSel.value = user.college_id;
                        renderDepartments(user.department_id);
                    });

                collegeSel.addEventListener("change", function () {
                    renderDepartments(null);
                });

                function renderDepartments(selectedId) {
                    var cid = parseInt(collegeSel.value, 10);
                    var college = colleges.filter(function (c) { return c.id === cid; })[0];
                    var depts = (college ? college.departments : []).filter(function (d) {
                        return d.status === "active";
                    });
                    deptSel.innerHTML = depts
                        .map(function (d) {
                            return '<option value="' + d.id + '">' + PAIP.escapeHtml(d.name) + "</option>";
                        })
                        .join("");
                    if (selectedId) deptSel.value = selectedId;
                }

                // ---------- 加载筛选项（来自真实数据） ----------
                API.assetOptions().then(function (opt) {
                    document.getElementById("category-options").innerHTML = opt.categories
                        .map(function (c) { return '<option value="' + PAIP.escapeHtml(c) + '"></option>'; })
                        .join("");
                    document.getElementById("manage-options").innerHTML = opt.manage_depts
                        .map(function (c) { return '<option value="' + PAIP.escapeHtml(c) + '"></option>'; })
                        .join("");
                    document.getElementById("location-options").innerHTML = opt.locations
                        .map(function (c) { return '<option value="' + PAIP.escapeHtml(c) + '"></option>'; })
                        .join("");
                });

                // ---------- 图片选择 ----------
                var fileInput = document.getElementById("file-input");
                document.getElementById("btn-pick").addEventListener("click", function () {
                    fileInput.click();
                });
                fileInput.addEventListener("change", function () {
                    Array.prototype.slice.call(fileInput.files).forEach(function (f) {
                        pickedFiles.push(f);
                    });
                    fileInput.value = "";
                    renderPreview();
                });

                function renderPreview() {
                    document.getElementById("file-tip").textContent =
                        pickedFiles.length ? "已选择 " + pickedFiles.length + " 张图片" : "未选择图片";
                    document.getElementById("preview").innerHTML = pickedFiles
                        .map(function (f, idx) {
                            var url = URL.createObjectURL(f);
                            return (
                                '<div class="card p-2">' +
                                '<img class="thumb" style="height:110px" src="' + url + '" alt="预览" />' +
                                '<div style="margin-top:6px;font-size:12px">' +
                                '<label><input type="radio" name="cover" ' + (idx === coverIndex ? "checked" : "") +
                                ' data-cover="' + idx + '" /> 设为首图</label>' +
                                "</div>" +
                                '<input class="input" style="margin-top:4px;font-size:12px" placeholder="图片说明" data-cap="' +
                                idx + '" value="' + PAIP.escapeHtml(f._caption || "") + '" />' +
                                '<button type="button" class="btn btn-outline btn-sm" style="margin-top:6px;width:100%" data-del="' +
                                idx + '">移除</button>' +
                                "</div>"
                            );
                        })
                        .join("");

                    var box = document.getElementById("preview");
                    box.querySelectorAll("[data-cover]").forEach(function (r) {
                        r.onchange = function () {
                            coverIndex = parseInt(r.getAttribute("data-cover"), 10);
                        };
                    });
                    box.querySelectorAll("[data-cap]").forEach(function (i) {
                        i.oninput = function () {
                            pickedFiles[parseInt(i.getAttribute("data-cap"), 10)]._caption = i.value;
                        };
                    });
                    box.querySelectorAll("[data-del]").forEach(function (b) {
                        b.onclick = function () {
                            pickedFiles.splice(parseInt(b.getAttribute("data-del"), 10), 1);
                            if (coverIndex >= pickedFiles.length) coverIndex = 0;
                            renderPreview();
                        };
                    });
                }

                // ---------- 提交 ----------
                document.getElementById("publish-form").addEventListener("submit", function (e) {
                    e.preventDefault();
                    var err = document.getElementById("err");
                    err.classList.add("hidden");

                    var assetNo = document.getElementById("asset_no").value.trim();
                    var name = document.getElementById("name").value.trim();
                    var total = parseInt(document.getElementById("total_count").value, 10);
                    var phone = document.getElementById("contact_phone").value.trim();
                    var empNo = document.getElementById("contact_emp_no").value.trim();
                    var location = document.getElementById("location").value.trim();
                    var contactPerson = document.getElementById("contact_person").value.trim();

                    if (!assetNo || !name) return showErr("请填写资产编号与资产名称");
                    if (!total || total <= 0) return showErr("总数必须为大于 0 的正整数");
                    if (!location || !contactPerson || !empNo || !phone)
                        return showErr("请完整填写存放地点、联系人、工号、联系电话");
                    if (!/^(1[3-9]\d{9}|\d{3,4}-?\d{7,8})$/.test(phone))
                        return showErr("联系电话格式不正确（手机号或固话如 010-12345678）");
                    if (!pickedFiles.length) return showErr("请至少上传 1 张真实照片");

                    var form = new FormData();
                    [
                        "asset_no", "name", "category", "unit", "spec", "total_count",
                        "condition_desc", "remark", "using_person", "usage_direction",
                        "manage_dept", "location", "contact_person", "contact_emp_no", "contact_phone",
                    ].forEach(function (id) {
                        form.append(id, document.getElementById(id).value);
                    });
                    form.append("college_id", document.getElementById("college_id").value);
                    form.append("department_id", document.getElementById("department_id").value);
                    form.append("cover_index", String(coverIndex));
                    form.append(
                        "captions",
                        JSON.stringify(pickedFiles.map(function (f) { return f._caption || ""; }))
                    );
                    pickedFiles.forEach(function (f) {
                        form.append("files", f, f.name);
                    });

                    var btn = document.getElementById("btn-submit");
                    btn.disabled = true;
                    btn.textContent = "提交中...";
                    API.createAsset(form)
                        .then(function (asset) {
                            PAIP.toast("发布成功，已上架公共平台", "success");
                            location.href = "/user/asset.html?id=" + asset.id;
                        })
                        .catch(function (e2) {
                            showErr(e2.message);
                            btn.disabled = false;
                            btn.textContent = "提交并上架到公共平台";
                        });
                });

                function showErr(msg) {
                    var err = document.getElementById("err");
                    err.textContent = msg;
                    err.classList.remove("hidden");
                    window.scrollTo(0, 0);
                }
            },
        });
    </script>
</body>
</html>
