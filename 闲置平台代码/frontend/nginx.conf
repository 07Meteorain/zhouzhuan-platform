# 前端容器：静态站点 + 反向代理到后端，保证前后端同源（避免跨域）
#
# 说明：使用 Docker 内置 DNS（127.0.0.11）+ 变量形式 proxy_pass，
#       这样即使 backend 尚未就绪，nginx 也能正常启动（运行时再解析）。

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 大图片上传与中文文件名
    client_max_body_size 50m;
    charset utf-8;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # API 反向代理（变量形式会保留原始 URI，后端路由前缀同为 /api）
    location /api/ {
        set $backend_api "http://backend:8000";
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 本地图片存储
    location /uploads/ {
        set $backend_static "http://backend:8000";
        proxy_pass $backend_static;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 静态页面：支持 /、/index.html、/user/xxx.html、/admin/xxx.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
