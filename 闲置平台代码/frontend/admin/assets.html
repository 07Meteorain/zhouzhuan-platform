<!DOCTYPE html>
<!--
  页面名称：物资管理（全量查看 / 强制下架 / 重新挂牌 / 图片真实性核验）
  所属角色：平台管理员
  依赖 API：GET /api/admin/assets、PUT /api/admin/assets/{id}（修正异常）、
           POST /api/admin/assets/{id}/force-off、
           POST /api/admin/assets/{id}/relist、
           POST /api/admin/assets/{id}/images/{image_id}/reject、
           POST /api/admin/assets/{id}/images/{image_id}/restore、
           GET /api/claims?asset_id=、POST /api/claims/{id}/revoke（撤销认领）、GET /api/colleges
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>物资管理 · 公共资产闲置平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/js/common.css" />
</head>
<body>
    <div class="page">
        <h1 class="page-title">物资管理</h1>
        <div class="page-sub">全量查看平台物资；核验资产编号与图片真实性，可强制下架或重新挂牌。</div>

        <div class="toolbar no-print">
            <div class="field"><label class="label">资产名称 / 编号</label><input class="input" id="f-kw" /></div>
            <div class="field"><label class="label">状态</label>
                <select class="select" id="f-status">
                    <option value="">全部</option>
                    <option value="on">上架</option>
                    <option value="off">已下架</option>
                    <option value="disabled">已停用</option>
                </select>
            </div>
            <div class="field"><label class="label">学院</label><select class="select" id="f-college"><option value="">全部</option></select></div>
            <div class="field"><label class="label">部门</label><select class="select" id="f-dept"><option value="">全部</option></select></div>
            <button class="btn btn-sm" id="btn-search">搜索</button>
            <button class="btn btn-outline btn-sm" id="btn-reset">重置</button>
        </div>

        <div id="asset-list"></div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script>
        PAIP.boot({
            role: "admin",
            active: "assets",
            init: function () {
                var box = document.getElementById("asset-list");
                var colleges = [];
                var currentList = [];   // 保存当前列表，供「修正」弹窗回显原始值
                var collegeSel = document.getElementById("f-college");
                var deptSel = document.getElementById("f-dept");

                API.colleges().then(function (data) {
                    colleges = data;
                    collegeSel.innerHTML =
                        '<option value="">全部</option>' +
                        data.map(function (c) {
                            return '<option value="' + c.id + '">' + PAIP.escapeHtml(c.name) + "</option>";
                        }).join("");
                    renderDept();
                });
                collegeSel.addEventListener("change", renderDept);

                function renderDept() {
                    var cid = parseInt(collegeSel.value, 10);
                    var college = colleges.filter(function (c) { return c.id === cid; })[0];
                    var depts = college ? college.departments : [];
                    deptSel.innerHTML =
                        '<option value="">全部</option>' +
                        depts.map(function (d) {
                            return '<option value="' + d.id + '">' + PAIP.escapeHtml(d.name) + "</option>";
                        }).join("");
                }

                function load() {
                    API.adminListAssets({
                        keyword: document.getElementById("f-kw").value.trim(),
                        status: document.getElementById("f-status").value,
                        college_id: collegeSel.value,
                        department_id: deptSel.value,
                    })
                        .then(render)
                        .catch(function (e) { PAIP.toast(e.message, "error"); });
                }

                function render(list) {
                    currentList = list || [];
                    if (!list.length) {
                        box.innerHTML = '<div class="empty">暂无物资</div>';
                    return;
                }

                    box.innerHTML = list.map(function (a) {
                        var ops =
                            '<a class="btn btn-outline btn-sm" href="/user/asset.html?id=' + a.id + '">查看详情</a> ' +
                            '<button class="btn btn-sm" data-fix="' + a.id + '">修正</button> ' +
                            (a.status === "on"
                                ? '<button class="btn btn-danger btn-sm" data-force="' + a.id + '">强制下架</button>'
                                : '<button class="btn btn-success btn-sm" data-relist="' + a.id + '">重新挂牌</button>');

                        var imgs = a.images.length
                            ? a.images.map(function (im) {
                                  var rejected = im.audit_status === "rejected";
                                  return (
                                      '<div class="card p-2" style="border-color:' +
                                      (rejected ? "var(--danger)" : "var(--line)") + '">' +
                                      '<img class="thumb" style="height:110px;opacity:' + (rejected ? 0.4 : 1) +
                                      '" src="' + im.url + '" alt="图片" />' +
                                      '<div style="font-size:11px;margin-top:6px" class="muted">' +
                                      (im.is_cover ? '<span class="badge badge-info">首图</span> ' : "") +
                                      (rejected ? '<span class="badge badge-disabled">已驳回</span> ' : "") +
                                      "</div>" +
                                      '<div style="font-size:11px" class="muted">' +
                                      "上传人：" + PAIP.escapeHtml(im.uploader_name || "-") + "（" +
                                      PAIP.escapeHtml(im.uploader_emp_no || "-") + "）<br/>" +
                                      "部门：" + PAIP.escapeHtml(im.uploader_dept || "-") + "<br/>" +
                                      "时间：" + PAIP.escapeHtml(im.upload_time || "-") + "<br/>" +
                                      "规格：" + im.width + "×" + im.height + " · " +
                                      Math.round((im.file_size || 0) / 1024) + "KB<br/>" +
                                      "水印：" + PAIP.escapeHtml(im.watermark || "-") +
                                      (rejected
                                          ? '<br/><span style="color:#b91c1c">驳回：' +
                                            PAIP.escapeHtml(im.reject_reason || "-") + "</span>"
                                          : "") +
                                      "</div>" +
                                      '<div style="margin-top:6px">' +
                                      (rejected
                                          ? '<button class="btn btn-success btn-sm" data-restore="' + a.id + ":" + im.id + '">撤销驳回</button>'
                                          : '<button class="btn btn-outline btn-sm" data-reject="' + a.id + ":" + im.id + '">驳回</button>') +
                                      "</div></div>"
                                  );
                              }).join("")
                            : '<div class="muted">无图片</div>';

                        return (
                            '<div class="card mb-4"><div class="card-body">' +
                            '<div class="flex flex-wrap items-start justify-between gap-3">' +
                            "<div>" +
                            '<h2 class="card-title" style="margin:0">' + PAIP.escapeHtml(a.name) + " " +
                            PAIP.statusBadge(a.status) + "</h2>" +
                            '<div class="mono muted" style="font-size:12px">编号 ' + PAIP.escapeHtml(a.asset_no) +
                            " · " + PAIP.escapeHtml(a.dept_full_name || "-") + "</div>" +
                            '<div style="font-size:13px;margin-top:6px">' +
                            "总数 " + a.total_count + " · 已认领 " + a.claimed_count + " · 剩余 <b>" + a.remaining_count +
                            "</b> " + PAIP.escapeHtml(a.unit) + " ｜ 分类 " + PAIP.escapeHtml(a.category || "-") +
                            " ｜ 存放 " + PAIP.escapeHtml(a.location || "-") +
                            " ｜ 管理部门 " + PAIP.escapeHtml(a.manage_dept || "-") +
                            "</div>" +
                            '<div class="flex gap-2">' + ops + "</div>" +
                            "</div>" +
                            '<div class="mt-3">' +
                            '<div class="text-xs muted mb-2">图片真实性核验（仅通过核验的图片会在公共平台展示）</div>' +
                            '<div class="grid grid-cols-2 md:grid-cols-4 gap-3">' + imgs + "</div>" +
                            "</div>" +
                            '<div class="mt-3" data-transfers="' + a.id + '">' +
                            '<div class="text-xs muted mb-2">流转记录（管理员可撤销异常认领，撤销后数量自动恢复）</div>' +
                            '<div class="muted" style="font-size:12px">加载中...</div>' +
                            "</div>" +
                            "</div></div>"
                        );
                    }).join("");

                    bind();
                    loadTransfers(list);
                }

                /** 逐物资加载流转记录，并绑定「撤销认领」按钮 */
                function loadTransfers(list) {
                    list.forEach(function (a) {
                        API.listClaims({ asset_id: a.id })
                            .then(function (rows) {
                                var box = box.querySelector('[data-transfers="' + a.id + '"]');
                                if (!box) return;
                                if (!rows.length) {
                                    box.innerHTML =
                                        '<div class="text-xs muted mb-2">流转记录（管理员可撤销异常认领，撤销后数量自动恢复）</div>' +
                                        '<div class="muted" style="font-size:12px">暂无流转记录</div>';
                                    return;
                                }
                                box.innerHTML =
                                    '<div class="text-xs muted mb-2">流转记录（管理员可撤销异常认领，撤销后数量自动恢复）</div>' +
                                    '<table class="table"><thead><tr><th>时间</th><th>数量</th><th>转出部门</th>' +
                                    "<th>转入部门</th><th>接收人</th><th>工号</th><th>状态</th><th>操作</th></tr></thead><tbody>" +
                                    rows
                                        .map(function (c) {
                                            return (
                                                "<tr><td class='mono'>" + PAIP.escapeHtml(c.claim_time) + "</td>" +
                                                "<td>" + c.quantity + PAIP.escapeHtml(c.unit || "") + "</td>" +
                                                "<td>" + PAIP.escapeHtml(c.from_dept_name) + "</td>" +
                                                "<td>" + PAIP.escapeHtml(c.to_dept_name) + "</td>" +
                                                "<td>" + PAIP.escapeHtml(c.receiver_name) + "</td>" +
                                                "<td class='mono'>" + PAIP.escapeHtml(c.receiver_emp_no) + "</td>" +
                                                "<td>" + PAIP.statusBadge(c.status) + "</td>" +
                                                "<td>" + (c.status === "revoked"
                                                    ? '<span class="muted">已撤销</span>'
                                                    : '<button class="btn btn-danger btn-sm" data-revoke="' + c.id + '">撤销认领</button>') +
                                                "</td></tr>"
                                            );
                                        })
                                        .join("") +
                                    "</tbody></table>";

                                box.querySelectorAll("[data-revoke]").forEach(function (b) {
                                    b.onclick = function () {
                                        PAIP.promptBox(
                                            "撤销认领",
                                            "撤销原因（将记入日志，撤销后物资数量自动恢复）",
                                            "认领信息有误，撤销并恢复物资数量",
                                            function (reason) {
                                                API.revokeClaim(parseInt(b.getAttribute("data-revoke"), 10), reason)
                                                    .then(function () {
                                                        PAIP.toast("已撤销认领，数量已恢复", "success");
                                                        load();
                                                    })
                                                    .catch(function (e) { PAIP.toast(e.message, "error"); });
                                            }
                                        );
                                    };
                                });
                            })
                            .catch(function () {
                                /* 单个物资流转加载失败不阻塞整页 */
                            });
                    });
                }

                function bind() {
                    box.querySelectorAll("[data-fix]").forEach(function (b) {
                        b.onclick = function () {
                            var id = parseInt(b.getAttribute("data-fix"), 10);
                            var a = currentList.filter(function (x) { return x.id === id; })[0];
                            if (!a) return;
                            PAIP.formModal(
                                "修正物资 · " + a.asset_no,
                                [
                                    { name: "asset_no", label: "资产编号", value: a.asset_no, required: true },
                                    { name: "name", label: "资产名称", value: a.name, required: true },
                                    { name: "category", label: "分类", value: a.category },
                                    { name: "unit", label: "计量单位", value: a.unit },
                                    { name: "spec", label: "尺寸规格", value: a.spec },
                                    { name: "total_count", label: "总数", value: a.total_count, type: "number" },
                                    { name: "claimed_count", label: "已认领", value: a.claimed_count, type: "number" },
                                    { name: "condition_desc", label: "成色/状态说明", value: a.condition_desc },
                                    { name: "using_person", label: "使用人", value: a.using_person },
                                    { name: "usage_direction", label: "使用方向", value: a.usage_direction },
                                    { name: "manage_dept", label: "使用的管理部门", value: a.manage_dept },
                                    { name: "location", label: "存放地点", value: a.location },
                                    { name: "contact_person", label: "联系人", value: a.contact_person },
                                    { name: "contact_emp_no", label: "联系人工号", value: a.contact_emp_no },
                                    { name: "contact_phone", label: "联系电话", value: a.contact_phone },
                                    {
                                        name: "status",
                                        label: "状态",
                                        value: a.status,
                                        type: "select",
                                        options: [
                                            { value: "on", label: "上架" },
                                            { value: "off", label: "已下架" },
                                            { value: "disabled", label: "已停用" },
                                        ],
                                    },
                                    { name: "reason", label: "修正原因（记入日志）", value: "", full: true,
                                      placeholder: "如：资产编号录入错误，按台账更正" },
                                ],
                                function (data) {
                                    var payload = {
                                        asset_no: data.asset_no,
                                        name: data.name,
                                        category: data.category,
                                        unit: data.unit,
                                        spec: data.spec,
                                        condition_desc: data.condition_desc,
                                        using_person: data.using_person,
                                        usage_direction: data.usage_direction,
                                        manage_dept: data.manage_dept,
                                        location: data.location,
                                        contact_person: data.contact_person,
                                        contact_emp_no: data.contact_emp_no,
                                        contact_phone: data.contact_phone,
                                        status: data.status,
                                        reason: data.reason,
                                    };
                                    if (data.total_count !== "") payload.total_count = parseInt(data.total_count, 10);
                                    if (data.claimed_count !== "") payload.claimed_count = parseInt(data.claimed_count, 10);
                                    API.adminUpdateAsset(id, payload)
                                        .then(function () {
                                            PAIP.toast("已修正并留痕", "success");
                                            load();
                                        })
                                        .catch(function (e) { PAIP.toast(e.message, "error"); });
                                }
                            );
                        };
                    });
                    box.querySelectorAll("[data-force]").forEach(function (b) {
                        b.onclick = function () {
                            PAIP.promptBox("强制下架", "下架原因（将记入日志）", "图片或信息不实", function (reason) {
                                API.adminForceOff(parseInt(b.getAttribute("data-force"), 10), reason)
                                    .then(function () {
                                        PAIP.toast("已强制下架", "success");
                                        load();
                                    })
                                    .catch(function (e) { PAIP.toast(e.message, "error"); });
                            });
                        };
                    });
                    box.querySelectorAll("[data-relist]").forEach(function (b) {
                        b.onclick = function () {
                            API.adminRelist(parseInt(b.getAttribute("data-relist"), 10))
                                .then(function () {
                                    PAIP.toast("已重新挂牌", "success");
                                    load();
                                })
                                .catch(function (e) { PAIP.toast(e.message, "error"); });
                        };
                    });
                    box.querySelectorAll("[data-reject]").forEach(function (b) {
                        b.onclick = function () {
                            var parts = b.getAttribute("data-reject").split(":");
                            PAIP.promptBox(
                                "驳回图片",
                                "驳回原因（将通知发布部门重传真实照片）",
                                "图片疑似AI生成/伪造/与实物不符，请重新拍摄上传",
                                function (reason) {
                                    API.adminRejectImage(parseInt(parts[0], 10), parseInt(parts[1], 10), reason)
                                        .then(function () {
                                            PAIP.toast("已驳回", "success");
                                            load();
                                        })
                                        .catch(function (e) { PAIP.toast(e.message, "error"); });
                                }
                            );
                        };
                    });
                    box.querySelectorAll("[data-restore]").forEach(function (b) {
                        b.onclick = function () {
                            var parts = b.getAttribute("data-restore").split(":");
                            API.adminRestoreImage(parseInt(parts[0], 10), parseInt(parts[1], 10))
                                .then(function () {
                                    PAIP.toast("已撤销驳回", "success");
                                    load();
                                })
                                .catch(function (e) { PAIP.toast(e.message, "error"); });
                        };
                    });
                }

                document.getElementById("btn-search").onclick = load;
                document.getElementById("btn-reset").onclick = function () {
                    document.getElementById("f-kw").value = "";
                    document.getElementById("f-status").value = "";
                    collegeSel.value = "";
                    renderDept();
                    load();
                };

                load();
            },
        });
    </script>
</body>
</html>
