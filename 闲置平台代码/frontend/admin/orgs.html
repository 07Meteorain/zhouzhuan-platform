<!DOCTYPE html>
<!--
  页面名称：组织机构管理（专业学院 + 下设部门）
  所属角色：平台管理员
  依赖 API：GET /api/colleges、POST /api/admin/colleges、PUT /api/admin/colleges/{id}、
           DELETE /api/admin/colleges/{id}、POST /api/admin/departments、
           PUT /api/admin/departments/{id}、DELETE /api/admin/departments/{id}
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>组织机构管理 · 公共资产闲置平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/js/common.css" />
</head>
<body>
    <div class="page">
        <h1 class="page-title">组织机构管理</h1>
        <div class="page-sub">维护“专业学院 → 下设部门”两级关系；停用后该部门物资停止挂牌，可由管理员重新挂牌。</div>

        <div class="toolbar no-print">
            <div class="field">
                <label class="label">新增专业学院</label>
                <input class="input" id="c-name" placeholder="学院名称" />
            </div>
            <div class="field" style="min-width:120px">
                <label class="label">学院编码</label>
                <input class="input" id="c-code" placeholder="可选" />
            </div>
            <button class="btn btn-sm" id="btn-add-college">新增学院</button>
            <span style="flex:1"></span>
            <button class="btn btn-outline btn-sm" id="btn-refresh">刷新</button>
        </div>

        <div id="org-list"></div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script>
        PAIP.boot({
            role: "admin",
            active: "orgs",
            init: function () {
                var box = document.getElementById("org-list");

                /* ---------- 加载并渲染学院 / 部门 ---------- */
                function load() {
                    API.colleges().then(render).catch(function (e) {
                        PAIP.toast(e.message, "error");
                    });
                }

                function render(data) {
                    if (!data.length) {
                        box.innerHTML = '<div class="empty">暂无组织机构</div>';
                        return;
                    }
                    box.innerHTML = data.map(collegeCard).join("");
                    bind();
                }

                function collegeCard(c) {
                    var deptRows = c.departments.length
                        ? c.departments.map(deptRow).join("")
                        : '<tr><td colspan="4" class="muted">该学院下暂无部门</td></tr>';

                    return (
                        '<div class="card mb-4"><div class="card-body">' +
                        '<div class="flex flex-wrap items-center justify-between gap-2 mb-3">' +
                        '<h2 class="card-title" style="margin:0">' + PAIP.escapeHtml(c.name) +
                        ' <span class="badge badge-info mono">' + PAIP.escapeHtml(c.code || "-") + "</span> " +
                        PAIP.statusBadge(c.status) + "</h2>" +
                        '<div class="flex gap-2">' +
                        '<button class="btn btn-outline btn-sm" data-ren-c="' + c.id + '" data-n="' +
                        PAIP.escapeHtml(c.name) + '">学院改名</button>' +
                        '<button class="btn btn-sm ' + (c.status === "active" ? "btn-outline" : "btn-success") +
                        '" data-st-c="' + c.id + '" data-s="' + (c.status === "active" ? "disabled" : "active") +
                        '">' + (c.status === "active" ? "停用学院" : "启用学院") + "</button>" +
                        '<button class="btn btn-danger btn-sm" data-del-c="' + c.id + '">删除学院</button>' +
                        "</div></div>" +
                        '<table class="table"><thead><tr><th>下设部门</th><th>编码</th><th>状态</th>' +
                        '<th style="width:280px">操作</th></tr></thead><tbody>' +
                        deptRows +
                        "</tbody></table>" +
                        '<div class="card-body" style="padding-top:12px">' +
                        '<div class="flex gap-2 items-end">' +
                        '<div style="min-width:240px"><label class="label">新增下设部门名称</label>' +
                        '<input class="input" data-new-d="' + c.id + '" placeholder="如 实训中心" /></div>' +
                        '<button class="btn btn-sm" data-add-d="' + c.id + '">新增部门</button>' +
                        "</div></div></div>"
                    );
                }

                function deptRow(d) {
                    return (
                        "<tr><td>" + PAIP.escapeHtml(d.name) + "</td>" +
                        '<td class="mono muted">' + PAIP.escapeHtml(d.code || "-") + "</td>" +
                        "<td>" + PAIP.statusBadge(d.status) + "</td>" +
                        "<td>" +
                        '<button class="btn btn-outline btn-sm" data-ren-d="' + d.id + '" data-n="' +
                        PAIP.escapeHtml(d.name) + '">改名</button> ' +
                        '<button class="btn btn-sm ' + (d.status === "active" ? "btn-outline" : "btn-success") +
                        '" data-st-d="' + d.id + '" data-s="' + (d.status === "active" ? "disabled" : "active") +
                        '">' + (d.status === "active" ? "停用" : "启用") + "</button> " +
                        '<button class="btn btn-danger btn-sm" data-del-d="' + d.id + '">删除</button>' +
                        "</td></tr>"
                    );
                }

                /* ---------- 事件绑定 ---------- */
                function bind() {
                    box.querySelectorAll("[data-ren-c]").forEach(function (b) {
                        b.onclick = function () {
                            PAIP.promptBox("学院改名", "新的学院名称", b.getAttribute("data-n"), function (v) {
                                if (!v || !v.trim()) return;
                                API.updateCollege(parseInt(b.getAttribute("data-ren-c"), 10), { name: v.trim() })
                                    .then(function () {
                                        PAIP.toast("已改名", "success");
                                        load();
                                    })
                                    .catch(function (e) {
                                        PAIP.toast(e.message, "error");
                                    });
                            });
                        };
                    });

                    box.querySelectorAll("[data-st-c]").forEach(function (b) {
                        b.onclick = function () {
                            var s = b.getAttribute("data-s");
                            PAIP.confirmBox(
                                s === "disabled" ? "停用学院" : "启用学院",
                                s === "disabled"
                                    ? "停用后该学院下所有部门与物资将同步停用，物资可在物资管理中重新挂牌。"
                                    : "启用后该学院下部门与物资恢复可用状态。",
                                function () {
                                    API.updateCollege(parseInt(b.getAttribute("data-st-c"), 10), { status: s })
                                        .then(function () {
                                            PAIP.toast("操作成功", "success");
                                            load();
                                        })
                                        .catch(function (e) {
                                            PAIP.toast(e.message, "error");
                                        });
                                }
                            );
                        };
                    });

                    box.querySelectorAll("[data-del-c]").forEach(function (b) {
                        b.onclick = function () {
                            PAIP.confirmBox("删除学院", "确认删除该学院？存在下设部门或用户时无法删除。", function () {
                                API.deleteCollege(parseInt(b.getAttribute("data-del-c"), 10))
                                    .then(function () {
                                        PAIP.toast("已删除", "success");
                                        load();
                                    })
                                    .catch(function (e) {
                                        PAIP.toast(e.message, "error");
                                    });
                            });
                        };
                    });

                    box.querySelectorAll("[data-add-d]").forEach(function (b) {
                        b.onclick = function () {
                            var cid = b.getAttribute("data-add-d");
                            var input = box.querySelector('[data-new-d="' + cid + '"]');
                            var v = (input.value || "").trim();
                            if (!v) {
                                PAIP.toast("请填写部门名称", "error");
                                return;
                            }
                            API.createDepartment({ college_id: parseInt(cid, 10), name: v })
                                .then(function () {
                                    PAIP.toast("部门已新增", "success");
                                    load();
                                })
                                .catch(function (e) {
                                    PAIP.toast(e.message, "error");
                                });
                        };
                    });

                    box.querySelectorAll("[data-ren-d]").forEach(function (b) {
                        b.onclick = function () {
                            PAIP.promptBox("部门改名", "新的部门名称", b.getAttribute("data-n"), function (v) {
                                if (!v || !v.trim()) return;
                                API.updateDepartment(parseInt(b.getAttribute("data-ren-d"), 10), { name: v.trim() })
                                    .then(function () {
                                        PAIP.toast("已改名", "success");
                                        load();
                                    })
                                    .catch(function (e) {
                                        PAIP.toast(e.message, "error");
                                    });
                            });
                        };
                    });

                    box.querySelectorAll("[data-st-d]").forEach(function (b) {
                        b.onclick = function () {
                            var s = b.getAttribute("data-s");
                            PAIP.confirmBox(
                                s === "disabled" ? "停用部门" : "启用部门",
                                s === "disabled"
                                    ? "停用后该部门物资停止挂牌，可在物资管理中重新挂牌供其他部门认领。"
                                    : "启用后该部门物资恢复上架状态。",
                                function () {
                                    API.updateDepartment(parseInt(b.getAttribute("data-st-d"), 10), { status: s })
                                        .then(function () {
                                            PAIP.toast("操作成功", "success");
                                            load();
                                        })
                                        .catch(function (e) {
                                            PAIP.toast(e.message, "error");
                                        });
                                }
                            );
                        };
                    });

                    box.querySelectorAll("[data-del-d]").forEach(function (b) {
                        b.onclick = function () {
                            PAIP.confirmBox("删除部门", "确认删除该部门？存在用户或物资时无法删除。", function () {
                                API.deleteDepartment(parseInt(b.getAttribute("data-del-d"), 10))
                                    .then(function () {
                                        PAIP.toast("已删除", "success");
                                        load();
                                    })
                                    .catch(function (e) {
                                        PAIP.toast(e.message, "error");
                                    });
                            });
                        };
                    });
                }

                /* ---------- 顶部操作 ---------- */
                document.getElementById("btn-add-college").onclick = function () {
                    var name = document.getElementById("c-name").value.trim();
                    var code = document.getElementById("c-code").value.trim();
                    if (!name) {
                        PAIP.toast("请填写学院名称", "error");
                        return;
                    }
                    API.createCollege({ name: name, code: code })
                        .then(function () {
                            document.getElementById("c-name").value = "";
                            document.getElementById("c-code").value = "";
                            PAIP.toast("学院已新增", "success");
                            load();
                        })
                        .catch(function (e) {
                            PAIP.toast(e.message, "error");
                        });
                };

                document.getElementById("btn-refresh").onclick = load;

                load();
            },
        });
    </script>
</body>
</html>
