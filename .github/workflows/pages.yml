name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 校验静态页完整性
        run: |
          test -f docs/index.html || { echo "缺少 docs/index.html"; exit 1; }
          grep -q "周转物资平台" docs/index.html || { echo "index.html 内容异常"; exit 1; }
          grep -q "zz_demo_state_v1" docs/index.html || { echo "缺少演示适配层"; exit 1; }
          echo "静态页校验通过，大小 $(wc -c < docs/index.html) 字节"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
