        if (s && s.materials && s.materials.length) return s;
      }
    } catch (e) { /* 忽略损坏数据，回落到初始状态 */ }
    var s = freshState();
    save(s);
    return s;
  }
  function save(s) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* 隐私模式下忽略 */ }
  }

  var S = load();

  /* ---------- 演示用账号（口令统一 demo1234） ---------- */
  var USERS = SEED.users.map(function (u) { return clone(u); });

  function findUser(username) {
    for (var i = 0; i < USERS.length; i++) {
      if (USERS[i].username === username) return USERS[i];
    }
    return null;
  }
  function userById(id) {
    for (var i = 0; i < USERS.length; i++) if (USERS[i].id === id) return USERS[i];
    return null;
  }
  function ownerName(m) {
    var u = m.owner_id ? userById(m.owner_id) : null;
    return u ? u.name : null;
  }
  function ownerPhone(m) {
    var u = m.owner_id ? userById(m.owner_id) : null;
    return u ? (u.phone || '') : null;
  }
  function matById(id) {
    for (var i = 0; i < S.materials.length; i++) if (S.materials[i].id === id) return S.materials[i];
    return null;
  }
  function reqById(id) {
    for (var i = 0; i < S.requests.length; i++) if (S.requests[i].id === id) return S.requests[i];
    return null;
  }

  /* ---------- 库存：唯一写入口，等价 server/inventory.js ---------- */
  function logStock(m, biz, change, remark, reqId) {
    S.stock.push({
      material_id: m.id, biz_type: biz, change_qty: change,
      before_qty: m.available, after_qty: m.available, remark: remark,
      request_id: reqId || null, created_at: now()
    });
    // 修正 after_qty（上面的写法保证 before 正确）
    S.stock[S.stock.length - 1].after_qty = m.available;
  }

  function stockMove(m, change, biz, remark, reqId) {
    var before = m.available;
    m.available = before + change;
    S.stock.push({
      material_id: m.id, biz_type: biz, change_qty: change,
      before_qty: before, after_qty: m.available,
      remark: remark, request_id: reqId || null, created_at: now()
    });
  }

  // 核定预占：可发放量 = available - reserved，条件不足直接失败（防超卖）
  function reserve(m, qty) {
    if (m.available - m.reserved < qty) fail('可发放库存不足：当前可发放 ' + (m.available - m.reserved) + ' ' + m.unit + '，需要 ' + qty);
    m.reserved += qty;
    S.stock.push({
      material_id: m.id, biz_type: 'reserve', change_qty: 0,
      before_qty: m.available, after_qty: m.available,
      remark: '核定预占 ' + qty + '（预留 →' + m.reserved + '）',
      request_id: null, created_at: now()
    });
  }
  function release(m, qty, why) {
    m.reserved = Math.max(0, m.reserved - qty);
    S.stock.push({
      material_id: m.id, biz_type: 'release', change_qty: 0,
      before_qty: m.available, after_qty: m.available,
      remark: (why || '释放预占 ') + qty + '（预留 →' + m.reserved + '）',
      request_id: null, created_at: now()
    });
  }

  /* ---------- 流转记录 ---------- */
  function log(r, action, operator, from, to, note) {
    S.logs.push({
      request_id: r.id, action: action, operator: operator ? operator.name : '系统',
      operator_name: operator ? operator.name : '系统',
      from_status: from || null, to_status: to || null,
      note: note || '', created_at: now()
    });
  }

  /* ---------- 单号 ---------- */
  function nextCode() {
    S.seq += 1;
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return 'ZX' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + String(S.seq).padStart(3, '0');
  }

  /* ---------- 组装视图对象 ---------- */
  function matView(m) {
    return {
      id: m.id, name: m.name, size: m.size, category: m.category,
      location: m.location, unit: m.unit, total_qty: m.total_qty, qty_note: m.qty_note,
      owner_id: m.owner_id, owner_name: ownerName(m), owner_phone: ownerPhone(m),
      available: m.available, reserved: m.reserved
    };
  }
  function reqView(r) {
    var m = matById(r.material_id);
    var photos = null;
    try { photos = r.return_photos ? JSON.parse(r.return_photos) : []; } catch (e) { photos = []; }
    return {
      id: r.id, code: r.code, material_id: r.material_id,
      material_name: m ? m.name : '-', size: m ? m.size : '',
      material_category: m ? m.category : '', location: m ? m.location : '',
      unit: m ? m.unit : '件',
      applicant_name: r.applicant_name, applicant_no: r.applicant_no,
      borrower: r.borrower, phone: r.phone,
      owner_id: m ? m.owner_id : null, owner_name: m ? ownerName(m) : null,
      owner_phone: m ? ownerPhone(m) : null,
      apply_qty: r.apply_qty, approved_qty: r.approved_qty, issued_qty: r.issued_qty,
      returned_qty: r.returned_qty, missing_qty: r.missing_qty,
      return_declared_qty: r.return_declared_qty, return_photos: r.return_photos,
      return_photo_list: photos,
      purpose: r.purpose, use_start: r.use_start, use_end: r.use_end,
      deposit_note: r.deposit_note, status: r.status,
      status_text: STATUS_TEXT[r.status] || r.status,
      created_at: r.created_at
    };
  }

  /* ---------- 可见性 ---------- */
  function visibleReqs(user) {
    if (user.role === 'student') {
      return S.requests.filter(function (r) { return r.applicant_id === user.id; });
    }
    if (user.role === 'mentor') return S.requests.slice();
    if (user.role === 'warehouse') {
      var mine = S.materials.filter(function (m) { return m.owner_id === user.id; }).map(function (m) { return m.id; });
      return S.requests.filter(function (r) { return mine.indexOf(r.material_id) >= 0; });
    }
    return S.requests.slice(); // asset_admin 全局
  }

  // 仓库老师的待办：待核定 / 待发放 / 待清点
  function pendingFor(user) {
    if (user.role !== 'warehouse') return [];
    var mine = S.materials.filter(function (m) { return m.owner_id === user.id; }).map(function (m) { return m.id; });
    return S.requests.filter(function (r) {
      if (mine.indexOf(r.material_id) < 0) return false;
      return ['pending_warehouse', 'to_issue', 'return_submitted'].indexOf(r.status) >= 0;
    });
  }

  /* ---------- 路由处理 ---------- */
  var routes = {};

  routes['POST /api/login'] = function (path, body) {
    var u = findUser(String(body.username || '').trim());
    if (!u) fail('用户不存在：' + body.username, 401);
    if (String(body.password) !== 'demo1234') fail('口令错误（演示口令 demo1234）', 401);
    return { token: 'demo-' + u.username, user: clone(u) };
  };

  routes['GET /api/me'] = function (path, user) {
    if (!user) fail('未登录', 401);
    return {
      user: clone(user), roles: ROLE_TEXT,
      authMode: 'LocalAuth（演示）', approvalMode: 'LocalApproval（演示）'
    };
  };

  routes['GET /api/materials'] = function (path, user) {
    if (!user) fail('未登录', 401);
    if (user.role === 'warehouse') {
      return S.materials.filter(function (m) { return m.owner_id === user.id; }).map(matView);
    }
    if (user.role === 'asset_admin') return S.materials.map(matView);
    return S.materials.map(matView);
  };

  routes['POST /api/materials'] = function (path, body, user) {
    if (!user) fail('未登录', 401);
    if (user.role !== 'asset_admin') fail('仅资产管理员可调整物资负责人');
    var m = matById(Number(body.id));
    if (!m) fail('物资不存在');
    m.owner_id = Number(body.owner_id);
    save(S);
    return matView(m);
  };

  routes['GET /api/warehouse/staff'] = function (path, user) {
    if (!user) fail('未登录', 401);
    if (user.role !== 'asset_admin') fail('仅资产管理员可查看仓库老师名单');
    return USERS.filter(function (u) { return u.role === 'warehouse'; }).map(function (u) {
      return { id: u.id, name: u.name, username: u.username };
    });
  };

  routes['GET /api/requests'] = function (path, user) {
    if (!user) fail('未登录', 401);
    return visibleReqs(user).map(reqView);
  };

  routes['POST /api/requests'] = function (path, body, user) {
    if (!user) fail('未登录', 401);
    if (user.role !== 'student') fail('仅学生可提交申领');
    var m = matById(Number(body.material_id));
    if (!m) fail('物资不存在');
    var qty = Number(body.apply_qty);
    if (!Number.isInteger(qty) || qty < 1) fail('申请数量必须是 1 以上的整数');
    if (qty > m.available - m.reserved) {
      fail('可申领数量不足：当前可申请 ' + (m.available - m.reserved) + ' ' + m.unit);
    }
    var r = {
      id: S.requests.length + 1, code: nextCode(),
      material_id: m.id, applicant_id: user.id,
      applicant_name: user.name, applicant_no: user.student_no || '',
      borrower: body.borrower || user.name, phone: body.phone || user.phone || '',
      apply_qty: qty, approved_qty: null, issued_qty: null,
      returned_qty: null, missing_qty: 0,
      return_declared_qty: null, return_photos: null, return_submitted_at: null,
      purpose: body.purpose || '', use_start: body.use_start || '', use_end: body.use_end || '',
      deposit_note: body.deposit_note || '学生证抵押',
      status: 'pending_mentor', parent_id: null, created_at: now()
    };
    S.requests.push(r);
    log(r, '提交申领', user, null, 'pending_mentor', '申请 ' + qty + ' ' + m.unit);
    save(S);
    return reqView(r);
  };

  // 学生提交归还申请：不动库存
  routes['POST /api/requests/return-submit'] = function (path, body, user) {
    if (!user) fail('未登录', 401);
    var r = reqById(Number(body.id));
    if (!r) fail('单据不存在');
    if (r.applicant_id !== user.id) fail('只能为自己借用的物资提交归还');
    if (r.status !== 'in_use') fail('当前状态不可提交归还');
    var qty = Number(body.declared_qty);
    if (!Number.isInteger(qty) || qty < 0 || qty > r.issued_qty) {
      fail('申报数量必须是 0 ~ ' + r.issued_qty + ' 之间的整数');
    }
    var photos = body.photos || [];
    if (!Array.isArray(photos) || !photos.length) fail('请至少上传一张归还照片作为凭证');
    r.return_declared_qty = qty;
    r.return_photos = JSON.stringify(photos);
    r.return_submitted_at = now();
    r.status = 'return_submitted';
    log(r, '学生提交归还申请', user, 'in_use', 'return_submitted',
      '申报归还 ' + qty + '，已上传凭证 ' + photos.length + ' 张；等待负责老师清点');
    save(S);
    return reqView(r);
  };

  // 导师审批
  routes['POST /api/requests/mentor'] = function (path, body, user) {
    if (!user) fail('未登录', 401);
    if (user.role !== 'mentor') fail('仅导师可审批');
    var r = reqById(Number(body.id));
    if (!r) fail('单据不存在');
    if (r.status !== 'pending_mentor') fail('当前状态不可审批');
    if (body.pass) {
      r.status = 'pending_warehouse';
      log(r, '导师通过', user, 'pending_mentor', 'pending_warehouse', body.note || '');
    } else {
      r.status = 'rejected';
      log(r, '导师驳回', user, 'pending_mentor', 'rejected', body.note || '未说明原因');
    }
    save(S);
    return reqView(r);
  };

  // 负责老师核定：核定即预占；小于申请数则生成改单
  routes['POST /api/requests/check'] = function (path, body, user) {
    if (!user) fail('未登录', 401);
    if (user.role !== 'warehouse') fail('仅仓库老师可核定');
    var r = reqById(Number(body.id));
    if (!r) fail('单据不存在');
    var m = matById(r.material_id);
    if (m.owner_id !== user.id) {
      fail('该物资由「' + (ownerName(m) || '未绑定') + '」负责，无权操作此单');
    }
    if (r.status !== 'pending_warehouse') fail('当前状态不可核定');
    var qty = Number(body.approved_qty);
    if (!Number.isInteger(qty) || qty < 0) fail('核定数量必须是非负整数');

    if (qty === r.apply_qty) {
      reserve(m, qty);
      r.approved_qty = qty;
      r.status = 'to_issue';
      log(r, '仓库核定', user, 'pending_warehouse', 'to_issue', '完全通过，核定 ' + qty + ' ' + m.unit + '，库存已预占');
      save(S);
      return reqView(r);
    }

    // 部分通过：原单终止，预占额度转交改单
    var created = {
      id: S.requests.length + 1, code: nextCode(),
      material_id: m.id, applicant_id: r.applicant_id,
      applicant_name: r.applicant_name, applicant_no: r.applicant_no,
      borrower: r.borrower, phone: r.phone,
      apply_qty: qty, approved_qty: null, issued_qty: null,
      returned_qty: null, missing_qty: 0,
      return_declared_qty: null, return_photos: null, return_submitted_at: null,
      purpose: r.purpose, use_start: r.use_start, use_end: r.use_end,
      deposit_note: r.deposit_note,
      status: 'pending_mentor', parent_id: r.id, created_at: now()
    };
    reserve(m, qty);
    r.approved_qty = qty;
    r.status = 'partial_closed';
    log(r, '仓库核定（部分通过）', user, 'pending_warehouse', 'partial_closed',
      '核定 ' + qty + ' / 申请 ' + r.apply_qty + ' ' + m.unit + '，已生成改单 ' + created.code);
    S.requests.push(created);
    log(created, '部分通过改单生成', user, null, 'pending_mentor',
      '由 ' + r.code + ' 部分通过转入，核定上限 ' + qty + ' ' + m.unit);
    save(S);
    return { request: reqView(r), created: reqView(created) };
  };

  // 发放：按实发扣库存，多余预占释放
  routes['POST /api/requests/issue'] = function (path, body, user) {
    if (!user) fail('未登录', 401);
    if (user.role !== 'warehouse') fail('仅仓库老师可发放');
    var r = reqById(Number(body.id));
    if (!r) fail('单据不存在');
    var m = matById(r.material_id);
    if (m.owner_id !== user.id) {
      fail('该物资由「' + (ownerName(m) || '未绑定') + '」负责，无权操作此单');
    }
    if (r.status !== 'to_issue') fail('当前状态不可发放');
    var qty = Number(body.issued_qty);
    if (!Number.isInteger(qty) || qty < 1) fail('实发数量必须大于 0');
    if (qty > r.approved_qty) fail('实发数量不能超过核定数量 ' + r.approved_qty);
    if (qty > m.available - (m.reserved - r.approved_qty)) fail('库存不足，无法发放');
    release(m, r.approved_qty, '部分通过改单，预占额度转交改单');
    stockMove(m, -qty, 'issue', '发放给' + r.applicant_name + ' ' + qty + m.unit, r.id);
    r.issued_qty = qty;
    r.deposit_note = body.deposit_note || r.deposit_note;
    r.status = 'in_use';
    log(r, '发放', user, 'to_issue', 'in_use', '实发 ' + qty + ' ' + m.unit + '，库存按实发扣减');
    save(S);
    return reqView(r);
  };

  // 老师清点登记：以实还为准回增库存，差额标记缺失不回增
  routes['POST /api/requests/return'] = function (path, body, user) {
    if (!user) fail('未登录', 401);
    if (user.role !== 'warehouse') fail('仅仓库老师可登记归还');
    var r = reqById(Number(body.id));
    if (!r) fail('单据不存在');
    var m = matById(r.material_id);
    if (m.owner_id !== user.id) {
      fail('该物资由「' + (ownerName(m) || '未绑定') + '」负责，无权操作此单');
    }
    if (['in_use', 'return_submitted'].indexOf(r.status) < 0) fail('当前状态不可归还');
    var photos = [];
    if (r.return_photos) { try { photos = JSON.parse(r.return_photos); } catch (e) { photos = []; } }
    if (body.photos && body.photos.length) photos = body.photos;
    if (!photos.length) fail('请上传至少一张归还照片作为凭证');

    var qty = Number(body.returned_qty);
    if (!Number.isInteger(qty) || qty < 0 || qty > r.issued_qty) {
      fail('实还数量必须是 0 ~ ' + r.issued_qty + ' 之间的整数');
    }
    stockMove(m, qty, 'return', '归还 ' + qty + m.unit, r.id);
    r.returned_qty = qty;
    r.missing_qty = r.issued_qty - qty;
    r.return_photos = JSON.stringify(photos);
    if (r.return_declared_qty != null && r.return_declared_qty !== qty) {
      r.status = 'mismatch';
      log(r, '老师清点（账实不符）', user, r.status === 'mismatch' ? 'return_submitted' : 'in_use', 'mismatch',
        '学生申报 ' + r.return_declared_qty + '，实际清点 ' + qty + '，缺失 ' + r.missing_qty + ' ' + m.unit + ' 转入学校物资丢失流程');
    } else {
      r.status = 'returned';
      log(r, '老师清点', user, 'return_submitted', 'returned', '归还 ' + qty + ' ' + m.unit + '，账实相符');
    }
    save(S);
    return reqView(r);
  };

  // 资产管理员核销
  routes['POST /api/requests/close'] = function (path, body, user) {
    if (!user) fail('未登录', 401);
    if (user.role !== 'asset_admin') fail('仅资产管理员可核销');
    var r = reqById(Number(body.id));
    if (!r) fail('单据不存在');
    if (r.status !== 'mismatch') fail('当前状态不可核销');
    r.status = 'closed';
    log(r, '资产管理员核销', user, 'mismatch', 'closed', body.note || '');
    save(S);
    return reqView(r);
  };

  // 详情：附流转记录与库存流水
  routes['GET /api/requests/detail'] = function (path, user, query) {
    if (!user) fail('未登录', 401);
    var r = reqById(Number(query.id));
    if (!r) fail('单据不存在');
    if (user.role === 'student' && r.applicant_id !== user.id) fail('无权查看此单据');
    if (user.role === 'warehouse') {
      var m = matById(r.material_id);
      if (m.owner_id !== user.id) fail('该单据不属于您负责的物资');
    }
    var d = reqView(r);
    d.logs = S.logs.filter(function (l) { return l.request_id === r.id; });
    d.stock_logs = S.stock.filter(function (l) { return l.request_id === r.id; });
    return d;
  };

  /* ---------- fetch 拦截 ---------- */
  var realFetch = window.fetch.bind(window);

  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : input.url;
    var path = url.replace(/^https?:\/\/[^/]+/, '').split('?')[0];
    if (path.indexOf('/api/') !== 0) return realFetch(input, init);

    var opt = init || {};
    var method = (opt.method || 'GET').toUpperCase();
    var body = {};
    if (opt.body) { try { body = JSON.parse(opt.body); } catch (e) { body = {}; } }

    var token = null;
    if (opt.headers && opt.headers.Authorization) {
      token = String(opt.headers.Authorization).replace(/^Bearer\s+/i, '');
    }
    var user = null;
    if (token && token.indexOf('demo-') === 0) user = findUser(token.slice(5));
    if (!user && method === 'POST' && path === '/api/login') user = null;

    return new Promise(function (resolve) {
      setTimeout(function () {
        var key = method + ' ' + path;
        var handler = routes[key];
        try {
          if (path.indexOf('/api/requests/') === 0 && method === 'GET') {
            // /api/requests/{id} → 复用详情处理器
            var id = decodeURIComponent(path.slice('/api/requests/'.length));
            var d = routes['GET /api/requests/detail'](path, user, { id: id });
            return resolve({ ok: true, status: 200, json: function () { return Promise.resolve(d); } });
          }
          if (path === '/api/logout') {
            return resolve({ ok: true, status: 200, json: function () { return Promise.resolve({ ok: true }); } });
          }
          if (!handler) {
            return resolve({
              ok: false, status: 404,
              json: function () { return Promise.resolve({ error: '静态演示版未实现该接口：' + key }); }
            });
          }
          // POST 处理器签名为 (path, body, user)，GET 处理器签名为 (path, user, query)
          var data = (method === 'GET') ? handler(path, user, {}) : handler(path, body, user);
          resolve({ ok: true, status: 200, json: function () { return Promise.resolve(data); } });
        } catch (e) {
          resolve({
            ok: false, status: e.status || 400,
            json: function () { return Promise.resolve({ error: e.message }); }
          });
        }
      }, 60); // 轻微延迟，保留真实网络请求的手感
    });
  };

  /* ---------- 供页面调用的演示辅助 ---------- */
  window.DEMO = {
    reset: function () {
      localStorage.removeItem(STORE_KEY);
      localStorage.removeItem(TOKEN_KEY);
      location.reload();
    },
    snapshot: function () { return S; }
  };
})();</script>
<script>
/* 静态演示版：插入提示条 */
(function () {
  function mount() {
    if (document.getElementById('demoBar')) return;
    var w = document.querySelector('.wrap');
    if (!w) return;
    w.insertAdjacentHTML('afterbegin', document.getElementById('demoBarTpl').innerHTML);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
})();
</script>
<script>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
let TOKEN = localStorage.getItem('zz_token') || '';
let ME = null;
const login = $('login'), app = $('app'), view = $('view'), who = $('who'), mode = $('mode'), loginErr = $('loginErr');
const u = $('u'), p = $('p');

async function api(path, opt) {
  const r = await fetch(path, Object.assign({
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
  }, opt || {}));
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 401) { localStorage.removeItem('zz_token'); location.reload(); } throw new Error(d.error || ('HTTP ' + r.status)); }
  return d;
}
function fill(username) { u.value = username; p.value = 'demo1234'; loginErr.textContent = ''; }
async function doLogin() {
  try {
    const d = await api('/api/login', { method: 'POST', body: JSON.stringify({ username: u.value.trim(), password: p.value }) });
    TOKEN = d.token; localStorage.setItem('zz_token', TOKEN); await boot();
  } catch (e) { loginErr.textContent = e.message; }
}
async function logout() {
  await api('/api/logout', { method: 'POST' }).catch(() => {});
  localStorage.removeItem('zz_token'); location.reload();
}
async function boot() {
  if (!TOKEN) return;
  try {
    const d = await api('/api/me');
    ME = d.user;
    login.classList.add('hide'); app.classList.remove('hide');
    who.textContent = ' · ' + ME.name + ' · ' + d.roles[ME.role];
    mode.textContent = '认证:' + d.authMode + ' 审批:' + d.approvalMode;
    render();
  } catch (e) { localStorage.removeItem('zz_token'); }
}

const STATUS_TEXT = {
  pending_mentor: '待导师审批', pending_warehouse: '待仓库核库存', to_issue: '待发放',
  in_use: '借用中', return_submitted: '待老师清点', returned: '已归还',
  partial_closed: '部分通过已终止', rejected: '已驳回', mismatch: '账实不符待处理', closed: '已核销',
};
function tag(t) {
  if (/驳回|终止/.test(t)) return '<span class="tag err">' + esc(t) + '</span>';
  if (/不符/.test(t)) return '<span class="tag warn">' + esc(t) + '</span>';
  if (/已归还|已核销/.test(t)) return '<span class="tag ok">' + esc(t) + '</span>';
  if (/待老师清点/.test(t)) return '<span class="tag warn">' + esc(t) + '</span>';
  return '<span class="tag">' + esc(t) + '</span>';
}
const bizText = (t) => ({ reserve:'核定预占', release:'释放预占', issue:'发放', return:'归还', adjust:'调整' })[t] || t;

let ALL_MATS = [];
let ALL_REQS = [];
let STU_TAB = 'list';
let ADM_TAB = 'mismatch';
let PENDING_MAT = null;

async function render() {
  const r = ME.role;
  const [reqs, mats] = await Promise.all([
    api('/api/requests'),
    (r === 'student' || r === 'warehouse') ? api('/api/materials') : Promise.resolve([]),
  ]);
  try {
    if (r === 'student') {
      view.innerHTML = studentView(reqs, mats);
      if (PENDING_MAT && $('aMat')) { $('aMat').value = String(PENDING_MAT); onMatChange(); PENDING_MAT = null; }
    } else if (r === 'mentor') view.innerHTML = mentorView(reqs);
    else if (r === 'warehouse') view.innerHTML = warehouseView(reqs, mats);
    else view.innerHTML = await adminView(reqs);
  } catch (e) {
    view.innerHTML = '<div class="err" style="padding:20px">加载失败：' + esc(e.message) + '</div>';
  }
}

/* ================= 学生端 ================= */
function studentView(reqs, mats) {
  ALL_MATS = mats || []; ALL_REQS = reqs || [];
  const tabs = '<div class="tabs">' +
    '<button class="' + (STU_TAB === 'list' ? 'on' : '') + '" onclick="setStuTab(\'list\')">可申领物资</button>' +
    '<button class="' + (STU_TAB === 'apply' ? 'on' : '') + '" onclick="setStuTab(\'apply\')">新建申领</button>' +
    '<button class="' + (STU_TAB === 'mine' ? 'on' : '') + '" onclick="setStuTab(\'mine\')">我的申领</button>' +
    '<button class="' + (STU_TAB === 'return' ? 'on' : '') + '" onclick="setStuTab(\'return\')">我的借用与归还</button>' +
    '</div>';
  if (STU_TAB === 'apply') return tabs + applyPage();
  if (STU_TAB === 'mine') return tabs + myReqPage(reqs);
  if (STU_TAB === 'return') return tabs + returnBox(reqs);
  return tabs + matListPage();
}
function setStuTab(t) { STU_TAB = t; render(); }
function goApply(materialId) { STU_TAB = 'apply'; PENDING_MAT = materialId; render(); }

function matListPage() {
  return '<h2>可申领物资（' + ALL_MATS.length + ' 种）</h2>' +
    '<div class="hint">先在这里挑好物资，点卡片上的<b>「申领」</b>直接进入申领页并自动选中它。也可以直接点上方「新建申领」页签，从下拉框里选。</div>' +
    '<div class="grid">' + (ALL_MATS.map(m =>
      '<div class="mcard">' +
        '<h3 style="margin-top:0">' + esc(m.name) + (m.size ? ' <span class="muted" style="font-weight:400;font-size:13px">' + esc(m.size) + '</span>' : '') + '</h3>' +
        '<div class="muted">' + esc(m.category || '-') + ' · ' + esc(m.location) + '</div>' +
        '<div class="qty">' + m.available + ' <span style="font-size:13px;color:#6b7684">' + esc(m.unit) + '在库</span></div>' +
        '<div class="muted" style="margin-top:6px">负责老师：<b style="color:#185fa5">' + esc(m.owner_name || '未绑定') + '</b>' + (m.owner_phone ? ' · ' + esc(m.owner_phone) : '') + '</div>' +
        (m.reserved > 0 ? '<div class="muted">已核定待发放 ' + m.reserved + ' ' + esc(m.unit) + '</div>' : '') +
        (m.qty_note ? '<div class="muted">台账登记：' + esc(m.qty_note) + '</div>' : '') +
        '<div class="row" style="margin-top:10px"><button class="sm" onclick="goApply(' + m.id + ')">申领</button></div>' +
      '</div>').join('') || '<div class="muted">暂无可申领物资</div>') + '</div>';
}

function applyPage() {
  if (!ALL_MATS.length) return '<h2>新建申领单</h2><div class="hint">当前暂无可申领物资。</div>';
  const opts = ALL_MATS.map(m =>
    '<option value="' + m.id + '">' + esc(m.name) + (m.size ? '（' + esc(m.size) + '）' : '') +
    ' — 可申请 ' + (m.available - m.reserved) + ' ' + esc(m.unit) + '</option>').join('');
  return '<h2>新建申领单</h2>' +
    '<div class="hint">选择物资后由<b>该物资的负责老师</b>核定数量并发放。申领单提交后先经导师审批。</div>' +
    '<div id="applyBox" style="background:#fff;padding:20px;border-radius:10px;max-width:640px">' +
    '<label>选择物资</label><select id="aMat" onchange="onMatChange()">' + opts + '</select>' +
    '<div id="aOwner" class="hint" style="margin-top:8px"></div>' +
    '<label>申请数量</label><input id="aQty" type="number" min="1" value="1">' +
    '<label>用途</label><input id="aPurpose" placeholder="例如：社团活动答辩">' +
    '<label>使用时间</label><div class="row"><input id="aStart" type="date"><input id="aEnd" type="date"></div>' +
    '<label>借用人</label><input id="aBorrower" placeholder="默认与本人一致">' +
    '<label>联系电话</label><input id="aPhone">' +
    '<label>抵押备注</label><input id="aDep" value="学生证抵押">' +
    '<div class="row" style="margin-top:14px"><button onclick="submitApply()">提交申领</button>' +
    '<button class="ghost" onclick="setStuTab(\'mine\')">取消</button></div>' +
    '<div id="applyMsg" class="err"></div></div>';
}
function onMatChange() {
  const sel = $('aMat'), box = $('aOwner');
  if (!sel || !box) return;
  const m = ALL_MATS.find(x => x.id === Number(sel.value));
  box.innerHTML = m
    ? '存放于 <b>' + esc(m.location) + '</b>，由 <b>' + esc(m.owner_name || '未绑定') + '</b> 负责，核定与发放都由这位老师处理；实际可申请 <b>' + (m.available - m.reserved) + '</b> ' + esc(m.unit) + '。' +
      (m.qty_note ? '（台账登记' + esc(m.qty_note) + '，发放前建议与老师核对）' : '')
    : '';
}
async function submitApply() {
  const matId = $('aMat').value;
  if (!matId) { $('applyMsg').textContent = '请先选择物资'; return; }
  try {
    await api('/api/requests', { method: 'POST', body: JSON.stringify({
      material_id: matId, apply_qty: Number($('aQty').value), purpose: $('aPurpose').value,
      use_start: $('aStart').value, use_end: $('aEnd').value, borrower: $('aBorrower').value,
      phone: $('aPhone').value, deposit_note: $('aDep').value }) });
    STU_TAB = 'mine'; PENDING_MAT = null;
    alert('申领已提交，等待导师审批'); render();
  } catch (e) { $('applyMsg').textContent = e.message; }
}

function myReqPage(reqs) {
  return '<h2>我的申领（' + reqs.length + '）</h2>' +
    '<div class="hint">申领单提交后由导师审批，再由<b>该物资的负责老师</b>核定数量。库存按实际发放数量扣减。</div>' +
    '<table><thead><tr><th>单号</th><th>物资</th><th>负责老师</th><th>申请</th><th>核定</th><th>实发</th><th>实还</th><th>状态</th><th>操作</th></tr></thead><tbody>' +
    (reqs.map(r => '<tr>' +
      '<td>' + esc(r.code) + '</td><td>' + esc(r.material_name) + '</td><td class="muted">' + esc(r.owner_name || '-') + '</td>' +
      '<td>' + r.apply_qty + '</td><td>' + (r.approved_qty ?? '-') + '</td><td>' + (r.issued_qty ?? '-') + '</td><td>' + (r.returned_qty ?? '-') + '</td>' +
      '<td>' + tag(r.status_text) + '</td>' +
      '<td><button class="ghost sm" onclick="detail(' + r.id + ')">详情</button></td></tr>').join('')
      || '<tr><td colspan="9">暂无申领记录</td></tr>') + '</tbody></table>';
}

function returnBox(reqs) {
  const using = reqs.filter(r => r.status === 'in_use');
  const waiting = reqs.filter(r => r.status === 'return_submitted');
  const done = reqs.filter(r => r.status === 'returned' || r.status === 'mismatch' || r.status === 'closed');
  const head = '<thead><tr><th>单号</th><th>物资</th><th>负责老师</th><th>实发</th><th>申报归还</th><th>实还</th><th>缺失</th><th>状态</th><th>操作</th></tr></thead>';
  const row = (r, action) => '<tr>' +
    '<td>' + esc(r.code) + '</td><td>' + esc(r.material_name) + '</td><td class="muted">' + esc(r.owner_name || '-') + '</td>' +
    '<td>' + (r.issued_qty ?? '-') + '</td><td>' + (r.return_declared_qty ?? '-') + '</td><td>' + (r.returned_qty ?? '-') + '</td>' +
    '<td>' + (r.missing_qty ? '<b style="color:#a32d2d">' + r.missing_qty + '</b>' : '0') + '</td>' +
    '<td>' + tag(r.status_text) + '</td><td>' + action + '</td></tr>';
  return '<h2>我的借用与归还</h2>' +
    '<div class="hint">归还分两步：先在这里<b>拍照提交归还申请</b>，再由<b>负责老师现场清点</b>并登记实际归还数量。若清点少于实发数量，差额进入学校物资丢失流程，<b>不会计入库存</b>。</div>' +
    '<h3>借用中·待提交归还（' + using.length + '）</h3><table>' + head + '<tbody>' +
    (using.map(r => row(r, '<button class="sm" onclick="studentReturnGo(' + r.id + ',' + r.issued_qty + ')">提交归还</button> <button class="ghost sm" onclick="detail(' + r.id + ')">详情</button>')).join('')
      || '<tr><td colspan="9">暂无借用中的物资</td></tr>') + '</tbody></table>' +
    '<h3>已提交·待老师清点（' + waiting.length + '）</h3><table>' + head + '<tbody>' +
    (waiting.map(r => row(r, '<span class="muted">等待' + esc(r.owner_name || '负责老师') + '清点</span> <button class="ghost sm" onclick="detail(' + r.id + ')">详情</button>')).join('')
      || '<tr><td colspan="9">暂无待清点单据</td></tr>') + '</tbody></table>' +
    '<h3>已归还记录（' + done.length + '）</h3><table>' + head + '<tbody>' +
    (done.map(r => row(r, '<button class="ghost sm" onclick="detail(' + r.id + ')">详情</button>')).join('')
      || '<tr><td colspan="9">暂无归还记录</td></tr>') + '</tbody></table>';
}
function studentReturnGo(id, issued) {
  const qty = prompt('实发 ' + issued + ' 件，本次准备归还多少件？\n请如实填写，老师清点后以实际数量为准', issued);
  if (qty === null) return;
  const photos = prompt('归还凭证照片（可填多个，用逗号分隔）', '归还现场照片.jpg');
  if (photos === null) return;
  const list = photos.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  if (!list.length) return alert('请至少上传一张归还照片');
  api('/api/requests/return-submit', { method: 'POST', body: JSON.stringify({ id, declared_qty: Number(qty), photos: list }) })
    .then(() => { alert('归还申请已提交，等待负责老师清点'); render(); }).catch(e => alert(e.message));
}

/* ================= 导师端 ================= */
function mentorView(reqs) {
  ALL_REQS = reqs || [];
  const list = reqs.filter(r => r.status === 'pending_mentor');
  return '<h2>待我审批（' + list.length + '）</h2>' +
    '<div class="hint">导师仅负责审批。数量核定由仓库老师完成，部分通过时会生成改单并回到您这里再次审批。</div>' +
    '<table><thead><tr><th>单号</th><th>申请人</th><th>物资</th><th>负责老师</th><th>申请数量</th><th>用途</th><th>使用时间</th><th>操作</th></tr></thead><tbody>' +
    (list.map(r => '<tr>' +
      '<td>' + esc(r.code) + '</td><td>' + esc(r.applicant_name) + '</td><td>' + esc(r.material_name) + '</td>' +
      '<td class="muted">' + esc(r.owner_name || '-') + '</td><td>' + r.apply_qty + ' ' + esc(r.unit) + '</td>' +
      '<td class="muted">' + esc(r.purpose || '-') + '</td><td class="muted">' + esc(r.use_start || '-') + ' ~ ' + esc(r.use_end || '-') + '</td>' +
      '<td class="row"><button class="sm" onclick="mentorGo(' + r.id + ',1)">通过</button>' +
      '<button class="ghost sm" onclick="mentorGo(' + r.id + ',0)">驳回</button>' +
      '<button class="ghost sm" onclick="detail(' + r.id + ')">详情</button></td></tr>').join('')
      || '<tr><td colspan="8">暂无待审批单据</td></tr>') + '</tbody></table>';
}
async function mentorGo(id, pass) {
  const note = prompt(pass ? '审批备注（可留空）' : '驳回原因', '');
  if (note === null) return;
  try {
    await api('/api/requests/mentor', { method: 'POST', body: JSON.stringify({ id, pass, note }) });
    alert(pass ? '已通过' : '已驳回'); render();
  } catch (e) { alert(e.message); }
}

/* ================= 仓库老师端 ================= */
function warehouseView(reqs, mats) {
  ALL_REQS = reqs || [];
  const wait = reqs.filter(r => r.status === 'pending_warehouse');
  const issue = reqs.filter(r => r.status === 'to_issue');
  const use = reqs.filter(r => r.status === 'in_use');
  const toCheck = reqs.filter(r => r.status === 'return_submitted');
  const myMats = mats || [];
  return '<h2>我负责的物资（' + myMats.length + ' 种）</h2>' +
    '<div class="hint">您是以下 ' + myMats.length + ' 种物资的负责老师。只有这些物资的申领单会路由到您这里，其他仓库老师看不到、也无权核定或发放。<b>待处理 ' + (wait.length + issue.length) + ' 单，待清点归还 ' + toCheck.length + ' 单，借用中 ' + use.length + ' 单。</b></div>' +
    '<div class="grid mb">' + (myMats.map(m => '<div class="mcard" style="border-left:3px solid #2563eb">' +
      '<h3 style="margin-top:0">' + esc(m.name) + (m.size ? ' <span class="muted" style="font-weight:400;font-size:13px">' + esc(m.size) + '</span>' : '') + '</h3>' +
      '<div class="muted">' + esc(m.category || '-') + ' · ' + esc(m.location) + '</div>' +
      '<div class="qty">' + m.available + ' <span style="font-size:13px;color:#6b7684">' + esc(m.unit) + '在库</span></div>' +
      '<div class="muted">已核定待发放：' + m.reserved + ' ' + esc(m.unit) + '</div>' +
      '<div class="muted" style="margin-top:6px">可发放 <b style="color:#185fa5">' + (m.available - m.reserved) + '</b> ' + esc(m.unit) + '</div>' +
      (m.qty_note ? '<div class="muted">台账' + esc(m.qty_note) + '，实发前请核对</div>' : '') +
      '</div>').join('') || '<div class="muted">暂未绑定任何物资</div>') + '</div>' +

    '<h2>待核定数量（' + wait.length + '）</h2>' +
    '<div class="hint">核定数量小于申请数量时会生成改单，学生需按核定数量修改后重新提交审批。核定即锁定库存，避免核定通过却发不出去。</div>' +
    '<table><thead><tr><th>单号</th><th>申请人</th><th>物资</th><th>申请</th><th>核定数量</th><th>操作</th></tr></thead><tbody>' +
    (wait.map(r => '<tr><td>' + esc(r.code) + '</td><td>' + esc(r.applicant_name) + '</td><td>' + esc(r.material_name) + '</td>' +
      '<td>' + r.apply_qty + ' ' + esc(r.unit) + '</td>' +
      '<td><input id="n' + r.id + '" type="number" min="0" value="' + r.apply_qty + '" style="width:80px"></td>' +
      '<td class="row"><button class="sm" onclick="check(' + r.id + ')">提交核定</button>' +
      '<button class="ghost sm" onclick="detail(' + r.id + ')">详情</button></td></tr>').join('')
      || '<tr><td colspan="6">暂无待核定单据</td></tr>') + '</tbody></table>' +

    '<h2>待发放（' + issue.length + '）</h2>' +
    '<div class="hint">学生需<b>携学生证到场抵押</b>后领取。实发数量可少于核定数量，差额自动释放回库存。</div>' +
    '<table><thead><tr><th>单号</th><th>申领人</th><th>物资</th><th>核定</th><th>实发数量</th><th>抵押备注</th><th>操作</th></tr></thead><tbody>' +
    (issue.map(r => '<tr><td>' + esc(r.code) + '</td><td>' + esc(r.borrower || r.applicant_name) + '</td><td>' + esc(r.material_name) + '</td>' +
      '<td>' + r.approved_qty + ' ' + esc(r.unit) + '</td>' +
      '<td><input id="i' + r.id + '" type="number" min="1" value="' + r.approved_qty + '" style="width:80px"></td>' +
      '<td><input id="d' + r.id + '" value="学生证抵押" style="width:110px"></td>' +
      '<td class="row"><button class="sm" onclick="issueGo(' + r.id + ')">确认发放</button>' +
      '<button class="ghost sm" onclick="detail(' + r.id + ')">详情</button></td></tr>').join('')
      || '<tr><td colspan="7">暂无待发放单据</td></tr>') + '</tbody></table>' +

    '<h2>待清点归还（' + toCheck.length + '）</h2>' +
    '<div class="hint">学生已拍照提交归还申请。请<b>现场清点</b>后填入实际归还数量——以清点结果为准。若少于实发数量，差额进入学校物资丢失流程，<b>不会计入库存</b>。学生已上传的照片可在详情页查看。</div>' +
    '<table><thead><tr><th>单号</th><th>借用人</th><th>物资</th><th>实发</th><th>学生申报</th><th>实还数量</th><th>操作</th></tr></thead><tbody>' +
    (toCheck.map(r => '<tr><td>' + esc(r.code) + '</td><td>' + esc(r.borrower || r.applicant_name) + '</td><td>' + esc(r.material_name) + '</td>' +
      '<td>' + r.issued_qty + ' ' + esc(r.unit) + '</td>' +
      '<td>' + (r.return_declared_qty ?? '-') + ' ' + esc(r.unit) +
        (r.return_declared_qty != null && r.return_declared_qty !== r.issued_qty ? '<div class="muted">申报已少于实发，差额将进丢失流程</div>' : '') + '</td>' +
      '<td><input id="rt' + r.id + '" type="number" min="0" max="' + r.issued_qty + '" value="' + (r.return_declared_qty ?? r.issued_qty) + '" style="width:80px"></td>' +
      '<td class="row"><button class="sm" onclick="returnGo(' + r.id + ',' + r.issued_qty + ')">清点登记</button>' +
      '<button class="ghost sm" onclick="detail(' + r.id + ')">详情</button></td></tr>').join('')
      || '<tr><td colspan="7">暂无待清点单据</td></tr>') + '</tbody></table>' +

    '<h2>借用中·学生未提交归还（' + use.length + '）</h2>' +
    '<div class="hint">学生尚未在线上提交归还申请。若学生已到场归还，可直接在此清点登记。</div>' +
    '<table><thead><tr><th>单号</th><th>借用人</th><th>物资</th><th>实发</th><th>应还日期</th><th>实还数量</th><th>操作</th></tr></thead><tbody>' +
    (use.map(r => '<tr><td>' + esc(r.code) + '</td><td>' + esc(r.borrower || r.applicant_name) + '</td><td>' + esc(r.material_name) + '</td>' +
      '<td>' + r.issued_qty + ' ' + esc(r.unit) + '</td><td>' + esc(r.use_end || '-') + '</td>' +
      '<td><input id="rt' + r.id + '" type="number" min="0" max="' + r.issued_qty + '" value="' + r.issued_qty + '" style="width:80px"></td>' +
      '<td class="row"><button class="sm" onclick="returnGo(' + r.id + ',' + r.issued_qty + ')">清点登记</button>' +
      '<button class="ghost sm" onclick="detail(' + r.id + ')">详情</button></td></tr>').join('')
      || '<tr><td colspan="7">暂无借用中物资</td></tr>') + '</tbody></table>';
}
async function check(id) {
  try {
    const r = await api('/api/requests/check', { method: 'POST', body: JSON.stringify({ id, approved_qty: Number($('n' + id).value) }) });
    if (r.created) alert('已生成部分通过改单 ' + r.created.code + '，需学生修改后重新提交审批');
    else alert('已核定：完全通过');
    render();
  } catch (e) { alert(e.message); }
}
async function issueGo(id) {
  const qty = Number($('i' + id).value);
  try {
    await api('/api/requests/issue', { method: 'POST', body: JSON.stringify({ id, issued_qty: qty, deposit_note: $('d' + id).value }) });
    alert('已发放，库存按实发数量扣减'); render();
  } catch (e) { alert(e.message); }
}
function returnGo(id, issued) {
  const el = $('rt' + id);
  const qty = Number(el ? el.value : issued);
  if (!Number.isInteger(qty) || qty < 0 || qty > issued) return alert('实还数量必须是 0 ~ ' + issued + ' 之间的整数');
  if (qty > 0 && !confirm('确认清点：实发 ' + issued + '，实还 ' + qty + '，缺失 ' + (issued - qty) + '？\n库存将回增 ' + qty + '，缺失 ' + (issued - qty) + ' 进入丢失流程且不计入库存。')) return;
  api('/api/requests/return', { method: 'POST', body: JSON.stringify({ id, returned_qty: qty }) })
    .then(() => { alert(qty < issued ? '已登记归还 ' + qty + '，缺失 ' + (issued - qty) + ' 已转学校物资丢失流程' : '归还已登记，账实相符'); render(); })
    .catch(e => alert(e.message));
}

/* ================= 资产管理员端 ================= */
async function adminView(reqs) {
  ALL_REQS = reqs || [];
  const tabs = '<div class="tabs">' +
    '<button class="' + (ADM_TAB === 'mismatch' ? 'on' : '') + '" onclick="setTab(\'mismatch\')">账实不符待核销</button>' +
    '<button class="' + (ADM_TAB === 'assign' ? 'on' : '') + '" onclick="setTab(\'assign\')">物资负责人绑定</button>' +
    '<button class="' + (ADM_TAB === 'all' ? 'on' : '') + '" onclick="setTab(\'all\')">全部单据</button>' +
    '<button class="' + (ADM_TAB === 'stock' ? 'on' : '') + '" onclick="setTab(\'stock\')">库存总览</button></div>';
  if (ADM_TAB === 'assign') return tabs + await assignView();
  if (ADM_TAB === 'stock') return tabs + await stockView();
  if (ADM_TAB === 'all') return tabs + allView(reqs);
  return tabs + mismatchView(reqs);
}
function setTab(t) { ADM_TAB = t; render(); }
function mismatchView(reqs) {
  const mm = reqs.filter(r => r.status === 'mismatch');
  return '<h2>账实不符待核销（' + mm.length + '）</h2>' +
    '<div class="hint">缺失数量<b>不会计入库存</b>，仅在单据上标记，等学校丢失流程处理完成后由资产管理员核销。</div>' +
    '<table><thead><tr><th>单号</th><th>借用人</th><th>物资</th><th>负责老师</th><th>实发</th><th>实还</th><th>缺失</th><th>操作</th></tr></thead><tbody>' +
    (mm.map(r => '<tr><td>' + esc(r.code) + '</td><td>' + esc(r.borrower || r.applicant_name) + '</td><td>' + esc(r.material_name) + '</td>' +
      '<td class="muted">' + esc(r.owner_name || '-') + '</td><td>' + r.issued_qty + '</td><td>' + (r.returned_qty ?? 0) + '</td>' +
      '<td><b style="color:#a32d2d">' + r.missing_qty + '</b></td>' +
      '<td class="row"><button class="sm" onclick="closeGo(' + r.id + ')">核销</button>' +
      '<button class="ghost sm" onclick="detail(' + r.id + ')">详情</button></td></tr>').join('')
      || '<tr><td colspan="8">无账实不符单据</td></tr>') + '</tbody></table>';
}
async function closeGo(id) {
  const note = prompt('核销说明', '已按学校物资丢失流程处理完毕');
  if (note === null) return;
  try { await api('/api/requests/close', { method: 'POST', body: JSON.stringify({ id, note }) }); alert('已核销'); render(); }
  catch (e) { alert(e.message); }
}
async function assignView() {
  const ms = await api('/api/materials');
  const staff = await api('/api/warehouse/staff');
  const byOwner = {};
  ms.forEach(m => { const k = m.owner_name || '未绑定'; (byOwner[k] = byOwner[k] || []).push(m); });
  return '<h2>物资负责人绑定</h2>' +
    '<div class="hint">每种物资由一位仓库老师负责。学生的申领单只会路由给该老师，其他仓库老师无权处理。在此调整绑定后立即生效。</div>' +
    Object.entries(byOwner).map(([owner, list]) =>
      '<h2>' + esc(owner) + ' <span class="muted" style="font-weight:400">负责 ' + list.length + ' 种</span></h2>' +
      '<table><thead><tr><th>物资</th><th>类别</th><th>存放地点</th><th>在库</th><th>已核定待发</th><th>改绑给</th></tr></thead><tbody>' +
      list.map(m => '<tr><td>' + esc(m.name) + (m.size ? '（' + esc(m.size) + '）' : '') + '</td>' +
        '<td class="muted">' + esc(m.category || '-') + '</td><td class="muted">' + esc(m.location) + '</td>' +
        '<td>' + m.available + ' ' + esc(m.unit) + '</td><td>' + m.reserved + '</td>' +
        '<td><select onchange="assignGo(' + m.id + ',this.value)" style="width:170px">' +
        staff.map(s => '<option value="' + s.id + '"' + (s.id === m.owner_id ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') +
        '</select></td></tr>').join('') + '</tbody></table>').join('');
}
async function assignGo(materialId, ownerId) {
  try { await api('/api/materials', { method: 'POST', body: JSON.stringify({ id: materialId, owner_id: Number(ownerId) }) }); alert('负责人已更新，立即生效'); }
  catch (e) { alert(e.message); render(); }
}
async function stockView() {
  const ms = await api('/api/materials');
  const byOwner = {};
  ms.forEach(m => { const k = m.owner_name || '未绑定'; byOwner[k] = byOwner[k] || { n: 0, q: 0 }; byOwner[k].n++; byOwner[k].q += m.available; });
  return '<h2>库存总览</h2>' +
    '<div class="hint">共 ' + ms.length + ' 种物资，账面库存合计 ' + ms.reduce((a, m) => a + m.available, 0) + ' 件。在库 = 账面可用，已核定待发 = 已预占尚未发放。</div>' +
    '<div class="grid mb">' + Object.entries(byOwner).map(([k, v]) =>
      '<div class="mcard"><h3 style="margin-top:0">' + esc(k) + '</h3><div class="qty">' + v.q +
      ' <span style="font-size:13px;color:#6b7684">件在库</span></div><div class="muted">' + v.n + ' 种物资</div></div>').join('') + '</div>' +
    '<table><thead><tr><th>物资</th><th>规格</th><th>存放</th><th>负责老师</th><th>在库</th><th>已核定待发</th><th>可发放</th></tr></thead><tbody>' +
    ms.map(m => '<tr><td>' + esc(m.name) + '</td><td class="muted">' + esc(m.size || '-') + '</td><td class="muted">' + esc(m.location) + '</td>' +
      '<td class="muted">' + esc(m.owner_name || '-') + '</td><td>' + m.available + ' ' + esc(m.unit) + '</td><td>' + m.reserved + '</td>' +
      '<td><b style="color:#185fa5">' + (m.available - m.reserved) + '</b></td></tr>').join('') + '</tbody></table>';
}
function allView(reqs) {
  return '<h2>全部单据（' + reqs.length + '）</h2>' +
    '<div class="hint">资产管理员拥有全局视图，可查看所有仓库老师负责的单据。</div>' +
    '<table><thead><tr><th>单号</th><th>申请人</th><th>物资</th><th>负责老师</th><th>申请</th><th>核定</th><th>实发</th><th>实还</th><th>状态</th><th>操作</th></tr></thead><tbody>' +
    (reqs.map(r => '<tr><td>' + esc(r.code) + '</td><td>' + esc(r.applicant_name) + '</td><td>' + esc(r.material_name) + '</td>' +
      '<td class="muted">' + esc(r.owner_name || '-') + '</td><td>' + r.apply_qty + '</td><td>' + (r.approved_qty ?? '-') + '</td>' +
      '<td>' + (r.issued_qty ?? '-') + '</td><td>' + (r.returned_qty ?? '-') + '</td><td>' + tag(r.status_text) + '</td>' +
      '<td><button class="ghost sm" onclick="detail(' + r.id + ')">详情</button></td></tr>').join('')
      || '<tr><td colspan="10">暂无单据</td></tr>') + '</tbody></table>';
}

/* ================= 详情：独立页面 ================= */
let DETAIL_BACK = null;
function detail(id) {
  DETAIL_BACK = { tab: STU_TAB, admTab: ADM_TAB };
  openDetail(id);
}
async function openDetail(id) {
  view.innerHTML = '<div class="muted" style="padding:20px">加载中…</div>';
  let d;
  try { d = await api('/api/requests/' + id); }
  catch (e) { view.innerHTML = '<div class="err" style="padding:20px">加载失败：' + esc(e.message) + '</div>'; return; }
  view.innerHTML = detailPage(d);
  window.scrollTo({ top: 0 });
}
function detailBack() {
  if (DETAIL_BACK) { STU_TAB = DETAIL_BACK.tab; ADM_TAB = DETAIL_BACK.admTab; }
  DETAIL_BACK = null; render();
}
function detailPage(d) {
  const unit = d.unit || '件';
  const logs = d.logs || [];
  const stock = d.stock_logs || [];
  const steps = [
    ['申请', d.apply_qty, true], ['核定', d.approved_qty, d.approved_qty != null],
    ['实发', d.issued_qty, d.issued_qty != null], ['申报归还', d.return_declared_qty, d.return_declared_qty != null],
    ['实还', d.returned_qty, d.returned_qty != null],
  ];
  const qsteps = steps.map(([k, v, has]) =>
    '<div class="qstep ' + (has ? 'on' : 'zero') + '"><div class="k">' + k + '</div><div class="v">' +
    (has ? v : '-') + '<span style="font-size:12px;color:#6b7684"> ' + esc(unit) + '</span></div></div>').join('');
  const missingCell = d.missing_qty > 0
    ? '<div class="dcell" style="border-color:#f09595;background:#fcebeb"><div class="k">缺失待处理</div>' +
      '<div class="v" style="color:#a32d2d">' + d.missing_qty + ' ' + esc(unit) + '</div>' +
      '<div style="font-size:12px;color:#a32d2d;margin-top:4px">已转学校物资丢失流程，不计入库存</div></div>'
    : '<div class="dcell"><div class="k">缺失</div><div class="v">0 ' + esc(unit) + '</div></div>';
  let photos = [];
  try { photos = JSON.parse(d.return_photos || '[]'); } catch (e) { photos = []; }
  const photoSec = photos.length
    ? '<div class="dsec"><h3>归还凭证照片（' + photos.length + ' 张）</h3><div class="row">' +
      photos.map(x => '<span class="tag">' + esc(x) + '</span>').join('') + '</div></div>' : '';
  const tl = logs.length
    ? '<ul class="tl">' + logs.map((l, i) => '<li class="' + (i === logs.length - 1 ? 'cur' : '') + '">' +
      '<div class="when">' + esc(String(l.created_at).slice(0, 19).replace('T', ' ')) + '</div>' +
      '<div class="what">' + esc(l.action) + '</div>' +
      '<div class="who">' + esc(l.operator_name || '系统') +
      (l.from_status && l.to_status ? ' · ' + esc(fromTo(l)) : '') + (l.note ? ' · ' + esc(l.note) : '') + '</div></li>').join('') + '</ul>'
    : '<div class="muted">暂无流转记录</div>';
  const stockRows = stock.length
    ? '<table><thead><tr><th>时间</th><th>类型</th><th>变动</th><th>变动前</th><th>变动后</th><th>说明</th></tr></thead><tbody>' +
      stock.map(l => '<tr><td class="muted">' + esc(String(l.created_at).slice(5, 19).replace('T', ' ')) + '</td>' +
        '<td>' + esc(bizText(l.biz_type)) + '</td>' +
        '<td style="color:' + (l.change_qty > 0 ? '#0f6e56' : '#a32d2d') + '">' + (l.change_qty > 0 ? '+' : '') + l.change_qty + '</td>' +
        '<td>' + l.before_qty + '</td><td>' + l.after_qty + '</td>' +
        '<td class="muted">' + esc(l.remark || '-') + '</td></tr>').join('') + '</tbody></table>'
    : '<div class="muted">该单据暂无库存变动</div>';
  return '<div class="dback"><button class="ghost" onclick="detailBack()">← 返回列表</button></div>' +
    '<div class="dhead"><h2>' + esc(d.material_name) +
    (d.size ? ' <span class="muted" style="font-weight:400;font-size:14px">' + esc(d.size) + '</span>' : '') + '</h2>' +
    '<div class="muted" style="font-size:13px">单号 ' + esc(d.code) + '</div>' +
    '<div style="margin-top:10px">' + tag(d.status_text) + '</div>' +
    '<div class="qsteps">' + qsteps + '</div>' +
    '<div class="dgrid">' + missingCell +
    '<div class="dcell"><div class="k">申请人工号</div><div class="v">' + esc(d.applicant_no || '-') + '</div></div>' +
    '<div class="dcell"><div class="k">借用人</div><div class="v">' + esc(d.borrower || d.applicant_name) + '</div></div>' +
    '<div class="dcell"><div class="k">联系电话</div><div class="v">' + esc(d.phone || '-') + '</div></div>' +
    '</div></div>' +
    '<div class="dsec"><h3>物资与流程信息</h3><div class="dgrid">' +
    '<div class="dcell"><div class="k">物资类别</div><div class="v">' + esc(d.material_category || '-') + '</div></div>' +
    '<div class="dcell"><div class="k">存放地点</div><div class="v">' + esc(d.location || '-') + '</div></div>' +
    '<div class="dcell"><div class="k">负责老师</div><div class="v">' + esc(d.owner_name || '未绑定') +
    (d.owner_phone ? '<div style="font-size:12px;color:#6b7684">' + esc(d.owner_phone) + '</div>' : '') + '</div></div>' +
    '<div class="dcell"><div class="k">使用时间</div><div class="v">' + esc(d.use_start || '-') + ' ~ ' + esc(d.use_end || '-') + '</div></div>' +
    '<div class="dcell" style="grid-column:1/-1"><div class="k">用途</div><div class="v">' + esc(d.purpose || '-') + '</div></div>' +
    '<div class="dcell" style="grid-column:1/-1"><div class="k">抵押备注</div><div class="v">' + esc(d.deposit_note || '-') + '</div></div>' +
    '</div></div>' + photoSec +
    '<div class="dsec"><h3>流转记录（' + logs.length + '）</h3>' + tl + '</div>' +
    '<div class="dsec"><h3>库存流水（' + stock.length + '）</h3>' + stockRows + '</div>';
}
const fromTo = (l) => {
  const f = STATUS_TEXT[l.from_status] || l.from_status || '-';
  const t = STATUS_TEXT[l.to_status] || l.to_status || '-';
  return f === t ? f : f + ' → ' + t;
};
boot();
</script>
</body>
</html>
